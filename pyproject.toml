[project]
name = "beam"
description = "Barcode Scanning for ERPNext"
authors = [{name = "AgriTheory", email = "support@agritheory.dev"}]
readme = "README.md"
license = { file = "LICENSE" }
dynamic = [ "version", "dependencies", "requires-python" ]

[tool.poetry]
version = "15.4.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
python-barcode = "^0.15.1"
zebra-zpl = {git = "https://github.com/mtking2/py-zebra-zpl.git"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
pytest-order = "^1.3.0"
pytest-playwright = "^0.7.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=beam --cov-report term-missing"

[tool.black]
line-length = 99

[tool.codespell]
skip = '*.md, yarn.lock, *.js.map'

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.coverage.report]
skip_covered = true
skip_empty = true
omit = [
    "*/boot.py",
    "*/customize.py",
    "*/hooks.py",
    "*/install.py",
    "*/patches/*",
    "*/test_*.py",
    "*/tests/*",
]
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variable = [
    "beam/__init__.py:__version__"
]

[tool.semantic_release.branches.version]
match = "version-15"
