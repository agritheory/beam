name: Tests

on:
  push:
    branches: [ version-15 ]
  pull_request:

jobs:
  build-cups:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      cups_admin_user: ${{ steps.creds.outputs.user }}
      cups_admin_password: ${{ steps.creds.outputs.password }}
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Resolve CUPS admin credentials
        id: creds
        env:
          CUPS_ADMIN_USER_SECRET: ${{ secrets.CUPS_ADMIN_USER }}
          CUPS_ADMIN_PASSWORD_SECRET: ${{ secrets.CUPS_ADMIN_PASSWORD }}
        run: |
          echo "user=${CUPS_ADMIN_USER_SECRET:-admin}" >> "$GITHUB_OUTPUT"
          echo "password=${CUPS_ADMIN_PASSWORD_SECRET:-root}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CUPS image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: cups/cups
          file: cups/cups/Containerfile
          push: true
          build-args: |
            CUPS_ADMIN_USER=${{ steps.creds.outputs.user }}
            CUPS_ADMIN_PASSWORD=${{ steps.creds.outputs.password }}
          tags: ghcr.io/agritheory/beam-cups:sha-${{ github.sha }}

      - name: Export image reference
        id: image
        run: echo "image=ghcr.io/agritheory/beam-cups:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  tests:
    needs: build-cups
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      pull-requests: write
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false
    name: Server
    env:
      CUPS_ADMIN_USER: ${{ needs.build-cups.outputs.cups_admin_user }}
      CUPS_ADMIN_PASSWORD: ${{ needs.build-cups.outputs.cups_admin_password }}
      BEAM_CUPS_HOST: 127.0.0.1
      BEAM_CUPS_PORT: "1631"
      BENCH_ROOT: /home/runner/frappe-bench

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: YES
          MYSQL_ROOT_PASSWORD: 'admin'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -padmin" --health-interval=5s --health-timeout=2s --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3

      cups:
        image: ${{ needs.build-cups.outputs.image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 1631:631
        options: >-
          --add-host=host.docker.internal:host-gateway
          --health-cmd="bash -c 'echo > /dev/tcp/127.0.0.1/631'"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: 'yarn'

      - name: Add to Hosts
        if: ${{ !env.ACT }}
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install JS Dependencies
        run: yarn --prefer-offline

      - name: Install App Dependencies
        run: bash ${{ github.workspace }}/.github/helper/install_dependencies.sh

      - name: Install Bench Site and Apps
        env:
          MYSQL_HOST: 'localhost'
          MYSQL_PWD: 'admin'
        run: bash ${{ github.workspace }}/.github/helper/install.sh

      - name: Run Tests
        # shell: bash sets -o pipefail, without which the tee below would mask a
        # pytest failure and report the job green.
        shell: bash
        env:
          BENCH_ROOT: ${{ env.BENCH_ROOT }}
          BEAM_TEST_TELEMETRY: "true"
          BEAM_TEST_STACK_DUMP_SECONDS: "60"
        run: |
          bash ${{ github.workspace }}/.github/helper/ensure_bench_web.sh
          cd "${BENCH_ROOT}"
          source env/bin/activate
          python -m playwright install --with-deps chromium
          cd apps/beam
          pytest --cov=beam --cov-report=xml --cov-report=term-missing:skip-covered ./beam \
            --browser chromium \
            --disable-warnings -s | tee pytest-coverage.txt

      - name: Pytest coverage comment
        if: ${{ !env.ACT }}
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ${{ env.BENCH_ROOT }}/apps/beam/pytest-coverage.txt
          pytest-xml-coverage-path: ${{ env.BENCH_ROOT }}/apps/beam/coverage.xml
          default-branch: version-15
          report-only-changed-files: true
          xml-skip-covered: true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: test-results/
